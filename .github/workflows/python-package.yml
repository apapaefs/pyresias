name: Tutorials and tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install -r requirements-tutorials.txt pytest flake8
      - name: Check syntax and undefined names
        run: python -m flake8 . --select=E9,F --show-source --statistics
      - name: Run numerical, file-format and tutorial regressions
        run: python -m pytest -q
